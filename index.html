<style>
/* Mood: milk-white nail counter, coral-peach gel bottle, soft daylight.
   Structure follows Fresha: white surface, one accent for selection, sticky price + continue footer, bottom sheets for options. */
:root {
  color-scheme: light;
  --bg: oklch(1 0 0);
  --surface: oklch(0.975 0.008 8);
  --sunk: oklch(0.955 0.012 8);
  --line: oklch(0.91 0.013 8);
  --edge: oklch(0.66 0.04 8);
  --ink: oklch(0.26 0.03 8);
  --soft: oklch(0.46 0.03 8);
  --mute: oklch(0.56 0.025 8);
  --coral: oklch(0.72 0.12 8);
  --coral-ink: oklch(0.52 0.15 8);
  --coral-tint: oklch(0.955 0.03 8);
  --cta: oklch(0.29 0.035 8);
  --cta-ink: oklch(1 0 0);
  --ok: oklch(0.5 0.11 155);
  --ok-tint: oklch(0.955 0.03 155);
  --warn: oklch(0.52 0.11 70);
  --warn-tint: oklch(0.96 0.04 85);
  --bad: oklch(0.52 0.17 25);
  --bad-tint: oklch(0.955 0.03 25);
  --chat: oklch(0.93 0.015 245);
  --bubble-me: oklch(0.9 0.09 145);
  --line-green: oklch(0.7 0.19 150);
  --scrim: oklch(0.2 0.02 8 / 0.42);
  --sys: oklch(1 0 0 / 0.6);
  --font: 'Anuphan', 'IBM Plex Sans Thai', Tahoma, sans-serif;
}

* { box-sizing: border-box; }
body { background: var(--surface); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 56px; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Page shell */
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.top h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.top .sub { color: var(--soft); font-size: 14px; }
.seg { display: flex; gap: 2px; background: var(--sunk); padding: 3px; border-radius: 999px; }
.seg button { padding: 10px 16px; min-height: 44px; border-radius: 999px; font-weight: 500; font-size: 15px; color: var(--soft); transition: background .18s ease-out, color .18s ease-out; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px oklch(0.2 0.02 32 / 0.12); }
.stage { display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); gap: 40px; align-items: start; }
@media (max-width: 820px) { .stage { grid-template-columns: minmax(0, 1fr); gap: 28px; } }

/* Phone */
.phone { position: relative; width: 100%; max-width: 390px; height: 780px; margin: 0 auto; background: var(--bg); border-radius: 44px; overflow: hidden;
  border: 10px solid oklch(0.22 0.02 32); display: flex; flex-direction: column; box-shadow: 0 6px 8px oklch(0.2 0.02 32 / 0.08); }
@media (max-width: 440px) { .phone { height: 720px; border-width: 6px; border-radius: 32px; } }
.liff { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--bg); min-height: 52px; }
.liff .name { flex: 1; text-align: center; font-weight: 600; font-size: 15px; }
.liff .ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; color: var(--soft); }
.scroll { flex: 1; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
.pad { padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 20px; }
.title { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
.sec { font-size: 17px; font-weight: 600; }
.muted { color: var(--soft); font-size: 14px; }
.small { font-size: 13px; color: var(--mute); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.rowx { display: flex; align-items: center; gap: 10px; }

/* Footer (sticky summary + action, Fresha style) */
.footer { border-top: 1px solid var(--line); background: var(--bg); padding: 12px 16px 16px; display: flex; align-items: center; gap: 12px; }
.footer .sum { flex: 1; min-width: 0; }
.footer .sum b { display: block; font-size: 18px; font-weight: 600; }
.footer .sum span { font-size: 13px; color: var(--mute); white-space: nowrap; }
.footer .sum.empty b { font-size: 15px; font-weight: 500; color: var(--mute); }
.btn { min-height: 48px; padding: 12px 22px; border-radius: 999px; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .12s ease-out, opacity .18s; }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--cta); color: var(--cta-ink); }
.btn.primary:disabled { opacity: .35; cursor: not-allowed; }
.btn.secondary { border: 1.5px solid var(--line); color: var(--ink); background: var(--bg); }
.btn.danger { background: var(--bad); color: var(--cta-ink); }
.btn.block { width: 100%; }
.btn.sm { min-height: 44px; padding: 8px 16px; font-size: 15px; }
.link { color: var(--coral-ink); font-weight: 500; min-height: 44px; display: inline-flex; align-items: center; }

/* Shop header */
.ph { background: var(--coral-tint); color: var(--coral-ink); display: grid; place-items: center; font-size: 13px; font-weight: 500; text-align: center; }
.cover { height: 112px; border-radius: 16px; background: linear-gradient(135deg, var(--coral-tint), var(--surface)); display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 16px; }
.cover .wordmark { margin: 0; }
.cover.photo { position: relative; height: 150px; overflow: hidden; padding: 0; background: var(--sunk); }
.cover.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover.photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, oklch(0.2 0.03 8 / 0.78), oklch(0.2 0.03 8 / 0.25) 55%, oklch(0.2 0.03 8 / 0) 80%); }
.cover.photo .wordmark { position: absolute; left: 16px; bottom: 8px; z-index: 1; color: oklch(1 0 0) !important; text-shadow: 0 1px 6px oklch(0.15 0.02 8 / 0.6); }
.cover.photo .wordmark span { color: oklch(0.9 0.06 8); }
img.thumb { object-fit: cover; display: block; }
.cover .ph-note { font-size: 11.5px; color: var(--mute); }
.shop h2 { font-size: 24px; font-weight: 600; line-height: 1.25; }
.wordmark { font-size: 26px !important; font-weight: 500 !important; letter-spacing: 0.12em; color: var(--soft); }
.wordmark span { font-family: 'Dancing Script', cursive; font-size: 36px; letter-spacing: 0; color: var(--coral-ink); font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--soft); font-size: 14px; align-items: center; }
.meta .star { color: var(--coral-ink); font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.from-maps { font-size: 13px; color: var(--soft); background: var(--surface); border-radius: 10px; padding: 8px 12px; display: flex; gap: 8px; align-items: center; }

/* Category tabs */
.tabs-h { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
.tabs-h::-webkit-scrollbar { display: none; }
.tab-h { flex: none; min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); font-size: 15px; font-weight: 500; color: var(--ink); }
.tab-h[aria-pressed="true"] { background: var(--coral-tint); color: var(--coral-ink); border-color: var(--coral); }

/* Service rows */
.svc { width: 100%; display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); transition: border-color .18s ease-out, background .18s ease-out; }
.svc .thumb { width: 56px; height: 56px; border-radius: 12px; font-size: 11px; background: var(--surface); color: var(--coral); }
.svc .nm { font-weight: 500; font-size: 16px; line-height: 1.35; }
.svc .ds { font-size: 13px; color: var(--mute); }
.svc .pr { font-weight: 600; font-size: 15px; margin-top: 2px; }
.svc .pr s { color: var(--mute); font-weight: 400; margin-left: 6px; font-size: 13px; }
.add { width: 36px; height: 36px; border-radius: 999px; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--ink); }
.svc[aria-pressed="true"] { border-color: var(--coral); background: var(--coral-tint); }
.svc[aria-pressed="true"] .add { background: var(--coral); border-color: var(--coral); color: oklch(1 0 0); }
.tag { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 500; color: var(--coral-ink); margin-top: 4px; }

/* Technicians + dates + times */
.techs { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 2px 20px; }
.tech { flex: none; width: 68px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; text-align: center; }
.av { width: 56px; height: 56px; border-radius: 999px; background: var(--sunk); display: grid; place-items: center; font-weight: 600; font-size: 18px; color: var(--soft); border: 2px solid transparent; }
.tech[aria-pressed="true"] .av { border-color: var(--coral); background: var(--coral-tint); color: var(--coral-ink); }
.tech .sub { color: var(--mute); font-size: 11.5px; line-height: 1.2; }
.dates { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 2px 20px; }
.date { flex: none; width: 60px; height: 76px; border-radius: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; font-size: 12px; color: var(--soft); }
.date b { font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.date[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); color: oklch(1 0 0); }
.date[aria-pressed="true"] b { color: oklch(1 0 0); }
.date.full { opacity: .45; }
.date .cnt { font-size: 11px; line-height: 1.3; }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mcal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 0 -12px; }
.mcal .wd { font-size: 12px; color: var(--soft); text-align: center; padding: 2px 0; }
.mcal .d { min-height: 58px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 2px; font-size: 11px; color: var(--soft); }
.mcal .d b { font-size: 15px; font-weight: 500; color: var(--ink); line-height: 1; }
.mcal .d .m { font-size: 10px; line-height: 1; color: var(--coral-ink); }
.mcal .d.off { opacity: .35; border-style: dashed; }
.mcal .d.on { border-color: var(--coral); background: var(--coral-tint); }
.mcal .bar { width: 72%; height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; }
.mcal .bar i { display: block; height: 100%; background: var(--coral); }
.mcal .d.hot .bar i { background: var(--coral-ink); }
.part { font-size: 13px; color: var(--mute); font-weight: 500; margin-top: 4px; }
.slot { width: 100%; min-height: 52px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: 500; font-variant-numeric: tabular-nums; }
.slot[aria-pressed="true"] { border: 2px solid var(--coral); background: var(--coral-tint); padding: 11px 15px; }
.slot .deal { font-size: 13px; color: var(--coral-ink); font-weight: 500; display: inline-flex; gap: 4px; align-items: center; }

/* Summary card */
.card { border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.line-i { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.line-i .k { color: var(--soft); }
.line-i.save { color: var(--ok); }
.line-i.total { font-size: 18px; font-weight: 600; border-top: 1px solid var(--line); padding-top: 12px; }
.when { display: flex; gap: 12px; align-items: center; }
.when .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--coral-tint); color: var(--coral-ink); display: grid; place-items: center; }
.when b { font-size: 17px; font-weight: 600; display: block; }
.note { font-size: 13.5px; color: var(--soft); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.note.warn { background: var(--warn-tint); color: var(--warn); }
.note.ok { background: var(--surface); color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 500; }
.field input, .field select { font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); min-height: 48px; width: 100%; }

/* PromptPay */
.qr { width: 200px; height: 200px; margin: 0 auto; border-radius: 16px; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--mute); font-size: 13px; text-align: center; padding: 16px; }
.hold { text-align: center; font-size: 14px; color: var(--soft); }
.hold b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* LINE chat */
.chat { background: var(--chat); padding: 16px 14px 20px; display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
.bub { background: var(--bg); border-radius: 18px; padding: 10px 14px; max-width: 84%; font-size: 15px; }
.bub.me { align-self: flex-end; background: var(--bubble-me); }
.sys { align-self: center; font-size: 12px; color: var(--soft); background: var(--sys); padding: 3px 10px; border-radius: 999px; text-align: center; }
.flex { background: var(--bg); border-radius: 18px; overflow: hidden; max-width: 88%; }
.flex .hd { padding: 14px 16px 4px; font-weight: 600; font-size: 16px; }
.flex .bd { padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; color: var(--soft); }
.flex .bd b { color: var(--ink); }
.flex .ft { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
.flex .ft .btn { width: 100%; min-height: 44px; font-size: 15px; }
.rich { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--bg); }
.rich button { min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13.5px; font-weight: 500; border-left: 1px solid var(--line); }
.rich button:first-child { border-left: 0; color: var(--coral-ink); }

/* Coupons (promo-first path) */
.coupon { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--bg); text-align: left; width: 100%; }
.coupon .top-c { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 14px; align-items: center; }
.coupon .thumb { width: 64px; height: 64px; border-radius: 12px; font-size: 11px; }
.coupon .who { font-size: 12.5px; color: var(--coral-ink); font-weight: 600; }
.coupon .nm { font-weight: 500; }
.coupon .pr { font-weight: 600; }
.coupon .pr s { color: var(--mute); font-weight: 400; margin-left: 6px; font-size: 13px; }
.coupon .bt { border-top: 1px dashed var(--line); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--soft); }
.coupon .bt b { color: var(--coral-ink); font-weight: 600; }

/* Sheets, toast */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; }
.scrim.enter { animation: fade .2s ease-out; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 24px 24px 0 0; max-height: 82%; display: flex; flex-direction: column; }
.sheet.enter { animation: up .24s cubic-bezier(.22,1,.36,1); }
.sheet .grab { width: 40px; height: 4px; border-radius: 999px; background: var(--line); margin: 10px auto 0; }
.sheet .sh-hd { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px 20px; }
.sheet .sh-hd h3 { flex: 1; font-size: 19px; font-weight: 600; }
.sheet .sh-bd { overflow-y: auto; padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
.opt { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
.opt .grow { flex: 1; min-width: 0; }
.opt .grow small { display: block; color: var(--mute); font-size: 13px; }
.opt .pr { font-weight: 600; font-size: 15px; white-space: nowrap; }
.radio { width: 22px; height: 22px; border-radius: 999px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.opt[aria-pressed="true"] { border-color: var(--coral); background: var(--coral-tint); }
.opt[aria-pressed="true"] .radio { border-color: var(--coral); background: var(--coral); box-shadow: inset 0 0 0 3px var(--bg); }
.toast { position: absolute; left: 12px; right: 12px; top: 60px; z-index: 30; background: var(--cta); color: var(--cta-ink); border-radius: 14px; padding: 12px 14px; font-size: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.toast.enter { animation: up .2s ease-out; }
.toast button { color: var(--coral); font-weight: 600; min-height: 44px; padding: 0 6px; white-space: nowrap; }
.nw { white-space: nowrap; }
@keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Staff */
.navb { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--bg); }
.navb button { min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12.5px; color: var(--mute); font-weight: 500; }
.navb button[aria-current="page"] { color: var(--coral-ink); }
.next { background: var(--surface); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.next .lb { font-size: 13px; color: var(--coral-ink); font-weight: 600; }
.next .t { font-size: 34px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.next .w { font-size: 18px; font-weight: 600; }
.next .s { font-size: 14px; color: var(--soft); }
.next .acts { display: flex; gap: 8px; margin-top: 8px; }
.next .acts .primary { flex: 1; }
.qrow { width: 100%; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 12px 4px; border-bottom: 1px solid var(--line); min-height: 64px; }
.qrow .tm { font-weight: 600; font-variant-numeric: tabular-nums; }
.qrow .nm { font-weight: 500; }
.qrow .ds { font-size: 13px; color: var(--mute); }
.qrow.done { opacity: .5; }
.qacts { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 14px 64px; border-bottom: 1px solid var(--line); }
.st { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.st.ok { background: var(--ok-tint); color: var(--ok); }
.st.warn { background: var(--warn-tint); color: var(--warn); }
.st.bad { background: var(--bad-tint); color: var(--bad); }
.st.mute { background: var(--sunk); color: var(--soft); }
.st.coral { background: var(--coral-tint); color: var(--coral-ink); }
.view { display: flex; gap: 4px; background: var(--sunk); padding: 3px; border-radius: 999px; align-self: flex-start; }
.view button { min-height: 44px; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--soft); }
.view button[aria-pressed="true"] { background: var(--bg); color: var(--ink); }
.grid { display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; font-size: 12.5px; }

      case 's-wadd': go(() => { const s = svc(st.walk.svc); S.sheet = null; st.tab = 'today'; st.month = false; st.day = st.walk.mode === 'now' ? 0 : +el.dataset.d;
        if (st.walk.mode === 'now') { const id = 'w' + TODAY.length; TODAY.push({ id, t: +el.dataset.s, len: +el.dataset.len, who: 'Walk-in', what: s.name, tech: el.dataset.t, st: 'walk' }); toast('เพิ่ม walk-in ให้ช่าง' + techName(el.dataset.t) + ' แล้ว เวลานี้หายจากหน้าจองออนไลน์', { k: 'walk', id }); }
        else { const nm = st.walk.who === 'c1' ? 'คุณมายด์' : st.walk.who === 'c2' ? 'คุณนิด' : (st.walk.name || 'ลูกค้าที่โทรมา').trim(); EXTRA.push({ id: 'x' + EXTRA.length, day: +el.dataset.d, t: +el.dataset.s, len: +el.dataset.len, who: nm, what: s.name, tech: el.dataset.t, st: 'yes', paid: priceOf(s) }); S.newBooking = 'พนักงานจองให้ ' + nm + ': ' + dayLabel(+el.dataset.d) + ' ' + hhmm(+el.dataset.s) + ' · ' + s.name + ' · ช่าง' + techName(el.dataset.t); const depTxt = s.deposit ? (st.walk.dep === 'waive' ? ' · ยกเว้นมัดจำ (แจ้งเจ้าของแล้ว)' : ' · ส่งลิงก์มัดจำ ' + baht(s.deposit)) : ''; S.newBooking += depTxt; toast('จองให้' + nm + 'แล้ว' + (st.walk.who === 'phone' ? ' · ส่ง SMS ยืนยัน' : ' · ส่งใบนัดเข้า LINE') + depTxt); }
      }); break;
      case 's-toast': go(() => toast(v), keep); break;
      case 's-blk': go(() => { st.blk[el.dataset.f] = v; }, keep); break;
      case 's-new': go(() => { resetBuilder(); }); break;
      case 's-bback': go(() => { if (st.builder === 'form' || st.b.step <= 1) st.b.step = 0; else st.b.step--; }); break;
      case 's-bdone': go(() => { st.b.step = 0; }); break;
      case 's-tpl': go(() => { st.b.tpl = el.dataset.id; const t = TEMPLATES.find((x) => x.id === st.b.tpl); st.b.type = t.sug[0]; st.b.val = t.sug[1]; st.b.step = 2; }); break;
      case 's-val': go(() => { st.b.type = el.dataset.t; st.b.val = +v; }, keep); break;
      case 's-scope': go(() => { st.b.scope = v; }, keep); break;
      case 's-bnext': go(() => { st.b.step = 3; }); break;
      case 's-until': go(() => { st.b.until = v; }, keep); break;
      case 's-uses': go(() => { st.b.uses = +v; }, keep); break;
      case 's-publish': go(() => { const d = buildDraft(); const needs = needsApproval(d); d.status = needs ? 'wait' : 'on'; S.promos.unshift(d); st.b.step = 0; toast(needs ? 'ส่งให้เจ้าของแล้ว เปิดใช้เมื่อเจ้าของอนุมัติ' : 'เปิดใช้แล้ว ลูกค้าที่เข้าเงื่อนไขเห็นทันที'); }); break;
      // owner
      case 'o-ok': go(() => { S.promos.find((x) => x.id === el.dataset.id).status = 'on'; }); break;
      case 'o-no': go(() => { S.owner.rejecting = el.dataset.id; }, keep); break;
      case 'o-unreject': go(() => { S.owner.rejecting = null; }, keep); break;
      case 'o-reason': go(() => { const p = S.promos.find((x) => x.id === el.dataset.id); p.status = 'off'; p.reason = v; S.owner.rejecting = null; }); break;
      case 'o-adjust': go(() => { const p = S.promos.find((x) => x.id === el.dataset.id); p.note = 'เจ้าของ' + adjustLabel(p); applyAdjust(p); p.status = 'on'; S.owner.rejecting = null; }); break;
      case 'o-toggle': go(() => { if (v === 'loyalty') S.loyalty.on = !S.loyalty.on; else if (v === 'monthly') S.monthly = !S.monthly; else { const p = S.promos.find((x) => x.id === v); p.status = p.status === 'on' ? 'off' : 'on'; } }, keep); break;
      case 'o-reward': go(() => { S.loyalty.reward = v; S.owner.pickRw = false; }, keep); break;
      case 'o-pickrw': go(() => { S.owner.pickRw = !S.owner.pickRw; }, keep); break;
      case 'o-window': go(() => { BOOK_DAYS = +v; S.owner.openWin = true; }, keep); break;
      case 'o-limit': go(() => { LIMIT_PCT = +v; S.owner.openPerm = true; }, keep); break;
      case 'r-opt': go(() => { const k = el.dataset.k; if (k === 'cvar') { S.cust.variant = v; resetCust(v === 'B' ? 'promos' : 'services'); } if (k === 'builder') { st.builder = v; st.tab = 'promo'; resetBuilder(); } if (k === 'ohome') S.owner.home = v; }); break;
    }
  });

  function fromHash() { const h = (location.hash || '').slice(1); if (['customer', 'staff', 'owner'].includes(h)) S.role = h; }
  fromHash(); window.addEventListener('hashchange', () => { fromHash(); render(); });
  window.__proto = { S, TODAY, EXTRA, rowsFor, render };
  render();
  try { if (!localStorage.getItem('tour1')) { localStorage.setItem('tour1', '1'); setTimeout(() => startMission('customer'), 400); } } catch (_) {}
})();
</script>
